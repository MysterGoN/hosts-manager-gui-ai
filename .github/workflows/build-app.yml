name: Build desktop application

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            artifact: hosts-manager-gui-linux
            path: dist/hosts-manager-gui
          - name: Windows
            os: windows-latest
            artifact: hosts-manager-gui-windows
            path: dist/hosts-manager-gui.exe
          - name: macOS
            os: macos-latest
            artifact: hosts-manager-gui-macos
            path: dist/hosts-manager-gui

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Run lint
        run: uv run ruff check .

      - name: Run type checks
        run: uv run mypy src tests scripts

      - name: Run tests
        run: uv run pytest

      - name: Check UI scaling
        run: uv run python scripts/check_ui_scaling.py

      - name: Build one-file application
        run: uv run pyinstaller --noconfirm --clean packaging/hosts-manager-gui.spec

      - name: Upload application
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built applications
        uses: actions/download-artifact@v8
        with:
          path: dist/artifacts

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          chmod +x dist/artifacts/hosts-manager-gui-linux/hosts-manager-gui
          chmod +x dist/artifacts/hosts-manager-gui-macos/hosts-manager-gui
          tar -czf dist/release/hosts-manager-gui-linux.tar.gz \
            -C dist/artifacts/hosts-manager-gui-linux hosts-manager-gui
          tar -czf dist/release/hosts-manager-gui-macos.tar.gz \
            -C dist/artifacts/hosts-manager-gui-macos hosts-manager-gui
          zip -j dist/release/hosts-manager-gui-windows.zip \
            dist/artifacts/hosts-manager-gui-windows/hosts-manager-gui.exe
          cd dist/release
          sha256sum hosts-manager-gui-* > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/release/* \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"

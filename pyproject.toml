[project]
name = "hosts-manager-gui"
version = "0.4.0"
description = "Cross-platform GUI utility for managing hosts records."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "platformdirs>=4.5",
    "pyside6>=6.9",
    "truststore>=0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
hosts-manager-gui = "hmg.ui:main"

[dependency-groups]
dev = [
    "commitizen>=4.17.0",
    "mypy>=1.16",
    "pre-commit>=4.2",
    "pyinstaller>=6.18",
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "tests"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
version_scheme = "pep440"
tag_format = "v$version"
major_version_zero = true
annotated_tag = true
update_changelog_on_bump = true
bump_message = "chore(release): $current_version → $new_version"

[tool.hatch.build.targets.wheel]
packages = ["src/hmg"]
